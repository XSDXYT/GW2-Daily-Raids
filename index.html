<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15181c">
  <meta name="description" content="快速查看激战2今日四个日常 Boss 及所属副本，一键复制分享，支持未来七天与完整12天轮换查询。">
  <title>今日日常 · GW2 Raid Bounties</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/today.css">
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/rotation.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>
<body data-page="today">
  <a class="skip-link" href="#main-content">跳转到主要内容</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="index.html">GW2 <span>日常查询</span></a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html" class="nav-link active" aria-current="page">今日日常</a>
        <a href="rotation.html" class="nav-link">12天循环表</a>
      </nav>
    </header>
    <main id="main-content">
      <section class="today-section" aria-labelledby="today-heading">
        <div class="today-heading">
          <div><h1 id="today-heading">今日日常</h1><p class="date-line"><span id="today-date">读取当前日期…</span><span id="cycle-label">轮换计算中</span></p></div>
          <button id="copy-today" class="primary-button" type="button" disabled>一键复制今日日常</button>
        </div>
        <p class="reset-line">每日北京时间 08:00 刷新 <span aria-hidden="true">·</span> 距离刷新 <span id="countdown" role="timer" aria-label="距离下一次刷新">--:--:--</span></p>
        <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
        <div id="copy-fallback" class="copy-fallback" hidden>
          <label for="copy-text">自动复制不可用，请长按或选中下方文字复制。</label>
          <textarea id="copy-text" rows="10" readonly spellcheck="false"></textarea>
        </div>
        <div class="list-heading" aria-hidden="true"><span>组别</span><span>Boss</span><span>所属副本</span></div>
        <div id="today-grid" class="boss-list" aria-live="polite"></div>
        <noscript><p class="noscript">请启用 JavaScript 查看自动计算的日常数据。</p></noscript>
      </section>
      <section class="forecast-section" aria-labelledby="forecast-heading">
        <div class="forecast-top">
          <h2 id="forecast-heading">未来七天</h2>
          <button id="forecast-toggle" type="button" class="action-button" aria-controls="forecast-content" aria-expanded="false"><span id="forecast-toggle-text">展开未来7天</span><span class="button-arrow" aria-hidden="true">⌄</span></button>
        </div>
        <div id="forecast-content" hidden></div>
      </section>
      <p class="rotation-link"><a href="rotation.html">查看完整12天循环表 →</a></p>
    </main>
    <footer class="site-footer"><span>非官方玩家查询工具 · 日期以 UTC 为准</span><a href="https://wiki.guildwars2.com/wiki/Daily_Raid_Bounties" target="_blank" rel="noopener noreferrer">数据来源：GW2 Wiki ↗</a></footer>
  </div>
</body>
</html>
